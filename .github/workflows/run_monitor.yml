name: Monitoraggio Etna & INGV

on:
  schedule:
    # Esegue il monitoraggio automaticamente ogni 30 minuti
    - cron: '*/30 * * * *'
  
  # Permette di avviare il workflow manualmente in qualsiasi momento da GitHub
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      # 1. Scarica il codice del repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura l'ambiente Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Installa le dipendenze necessarie
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Esegue lo script di monitoraggio passando i Secrets di Telegram
      - name: Run monitoring script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python monitor_etna.py
